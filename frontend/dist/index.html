<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>媒体去重工具 (本机离线运行)</title>
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-title">Studio</div>
        <div class="brand-sub">v1.0 本地引擎</div>
      </div>
      <nav class="nav" id="nav">
        <button data-view="projects" class="nav-item active">项目列表</button>
        <button data-view="config" class="nav-item">扫描配置</button>
        <button data-view="progress" class="nav-item">扫描进度</button>
        <button data-view="results" class="nav-item">重复结果 <span class="nav-badge" id="pendingBadge" hidden>0</span></button>
        <button data-view="settings" class="nav-item">全局设置</button>
      </nav>
      <div class="sidebar-foot" id="sidebarFoot">
        <div class="foot-line"><span>FFmpeg 状态</span><span id="ffmpegStatus">检测中…</span></div>
        <div class="foot-line"><span>删除策略</span><span id="deleteModeFoot">回收站</span></div>
        <div class="foot-line muted" id="appDataPath"></div>
      </div>
    </aside>

    <main class="main" id="main">
      <!-- filled by views -->
    </main>
  </div>

  <div id="modalRoot" class="modal-root" hidden></div>
  <div id="toastRoot" class="toast-root"></div>

  <script src="./app.js"></script>
</body>
</html>
