name: Release

# 构建与打包全部收在 tools/build.sh（macOS）与 tools\build.ps1（Windows）里：
# 本地一条命令能复现的东西，才有资格只在 CI 里跑一次。这个 workflow 只负责
# 「换平台 → 调脚本 → 断言产物 → 传 artifact」，不重复写 wails 参数与文件名。
#
# 产物命名（与 go/internal/updater 的资产匹配一致）：
#   media-dedupe_<ver>_<goos>_<goarch>.zip
# 平台段取 GOOS，不改写成 "macos"：更新器按 runtime.GOOS 拼后缀找资产。

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-app:
    name: Build app ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            runner: macos-latest
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
          - goos: windows
            goarch: amd64
            runner: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 需要完整 tag 信息，脚本靠 git describe 解析版本号。
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must match vMAJOR.MINOR.PATCH"
            exit 1
          }

          TAG="$(git describe --tags --exact-match)"
          if [[ "$TAG" != "$GITHUB_REF_NAME" ]]; then
            echo "Git tag $TAG does not match release ref $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache: true
          # go.sum 在 go/ 下。不显式指定时 setup-go 只在仓库根找 go.sum，
          # 找不到就抛错、被它自己 catch 成一条 warning —— 表现为发版仍然能过，
          # 但模块缓存永远不命中，每次重新下载全部依赖。
          cache-dependency-path: go/go.sum

      - name: Test (Go)
        working-directory: go
        # Windows runner 默认 shell 是 PowerShell，占位文件那两行是 POSIX 写法；
        # 统一用 bash（runner 自带 Git bash），与下面 Install Wails CLI 一致。
        shell: bash
        run: |
          # frontend/frontend.go 用 //go:embed all:dist 内嵌前端产物，而 dist/
          # 是构建产物、不入库：全新 checkout 下，任何涉及 main 或 appmain 的
          # 编译都会报 "pattern all:dist: no matching files found"。测试不读这份
          # 资源，放一个占位文件让包编译即可，真正的产物由后面的构建步骤生成。
          mkdir -p frontend/dist
          : > frontend/dist/.keep
          go test ./...

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Wails CLI
        shell: bash
        run: |
          # CLI 版本固定到 go.mod 里那一版：用 @latest 时，CLI 与库的漂移只会
          # 在发版当天以「本地能编、这里编不出」的形式暴露。
          version="$(cd go && go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
          go install "github.com/wailsapp/wails/v2/cmd/wails@${version}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: tools/build.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\tools\build.ps1

      # 结构断言：目录名或可执行名对不上时，用户那边表现为「双击没反应」，
      # 而构建日志一片绿 —— 所以必须在产物上真查一遍。
      - name: Assert layout
        shell: bash
        run: |
          set -euo pipefail
          version="$(git describe --tags --exact-match | sed 's/^v//')"
          asset="dist/release/media-dedupe_${version}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"
          test -f "$asset" || { echo "缺少归档：$asset"; ls -R dist/release; exit 1; }

          names="$(unzip -Z1 "$asset" 2>/dev/null || python3 -c 'import zipfile,sys;print("\n".join(zipfile.ZipFile(sys.argv[1]).namelist()))' "$asset")"
          if [ "${{ matrix.goos }}" = "darwin" ]; then
            echo "$names" | grep -q "^media-dedupe\.app/Contents/MacOS/media-dedupe$" ||
              { echo "归档里没有 .app 内的可执行文件"; echo "$names" | head -20; exit 1; }
          else
            echo "$names" | grep -qx "media-dedupe.exe" || { echo "归档根缺少 media-dedupe.exe"; exit 1; }
          fi
          stray="$(echo "$names" | grep -v "^media-dedupe" || true)"
          if [ -n "$stray" ]; then echo "归档顶层出现多余条目：$stray"; exit 1; fi

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: media-dedupe-app-${{ matrix.goos }}-${{ matrix.goarch }}
          # 只传 zip：SHA256SUMS.txt 在 release job 里跨平台统一生成一次，
          # 每个 job 各传一份同名文件会让合并时互相覆盖。
          path: dist/release/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build-app]
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Checksums
        working-directory: release-assets
        run: |
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          test "${#assets[@]}" -ge 1

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "media-dedupe $GITHUB_REF_NAME" \
              --generate-notes
          fi
