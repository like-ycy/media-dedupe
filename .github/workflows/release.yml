name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-app:
    name: Build app ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            runner: macos-latest
            ext: ""
          - goos: darwin
            goarch: amd64
            runner: macos-latest
            ext: ""
          - goos: windows
            goarch: amd64
            runner: windows-latest
            ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 需要完整 tag 信息，保证与本地一样从 Git tag 解析版本。
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must match vMAJOR.MINOR.PATCH"
            exit 1
          }

          TAG="$(git describe --tags --exact-match)"
          if [[ "$TAG" != "$GITHUB_REF_NAME" ]]; then
            echo "Git tag $TAG does not match release ref $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build desktop app
        shell: bash
        run: |
          # 版本从当前 Git tag 解析，与本地可手动使用的 ldflags 保持一致。
          VERSION="$(git describe --tags --exact-match | sed 's/^v//')"
          export PATH="$(go env GOPATH)/bin:$PATH"
          OUT="media-dedupe-app${{ matrix.ext }}"

          # Keep packaging metadata aligned with the git tag.
          PYTHON_BIN=""
          if command -v python3 >/dev/null 2>&1; then
            PYTHON_BIN=python3
          elif command -v python >/dev/null 2>&1; then
            PYTHON_BIN=python
          else
            echo "Python is required to update wails.json productVersion"
            exit 1
          fi
          "$PYTHON_BIN" - "$VERSION" <<'PY'
          import json
          import sys
          from pathlib import Path

          version = sys.argv[1]
          path = Path("wails.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data.setdefault("info", {})["productVersion"] = version
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY

          # No -nsis: Windows ships as a single portable exe.
          # 注入版本号到 internal/version.Version，供更新检查使用。
          # 传入完整文件名（含 .exe），避免 Wails 2.16 在 Windows 上省略扩展名。
          wails build -platform "${{ matrix.goos }}/${{ matrix.goarch }}" \
            -ldflags "-X media-dedupe/internal/version.Version=${VERSION}" \
            -o "${OUT}"

          mkdir -p out
          ASSET="media-dedupe-app_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"

          if [ "${{ matrix.goos }}" = "windows" ]; then
            if [ -f "build/bin/${OUT}" ]; then
              BIN="build/bin/${OUT}"
            else
              BIN="${OUT}"
            fi
            test -f "$BIN"
            ls -la build/bin "$BIN" || true
            # Windows runner 可能没有 Info-ZIP，统一用 Python zipfile 打单文件包
            "$PYTHON_BIN" - "$BIN" "out/${ASSET}" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          bin_path = Path(sys.argv[1])
          out_path = Path(sys.argv[2])
          with zipfile.ZipFile(out_path, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              zf.write(bin_path, bin_path.name)
          PY
          else
            APP="build/bin/media-dedupe-app.app"
            if [ ! -d "$APP" ]; then
              APP="build/bin/media-dedupe.app"
            fi
            test -d "$APP"
            ls -la build/bin "$APP" || true
            # -y 保留 .app 内符号链接，-X 不写入 macOS 扩展属性
            OUT_ABS="$(cd out && pwd)/${ASSET}"
            (cd build/bin && zip -r -y -X "$OUT_ABS" "$(basename "$APP")")
          fi

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: media-dedupe-app-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build-app]
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          test "${#assets[@]}" -ge 1

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "media-dedupe $GITHUB_REF_NAME" \
              --generate-notes
          fi
