name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-app:
    name: Build app ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            runner: macos-latest
            ext: ""
          - goos: darwin
            goarch: amd64
            runner: macos-latest
            ext: ""
          - goos: windows
            goarch: amd64
            runner: windows-latest
            ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate release tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must match vMAJOR.MINOR.PATCH"
            exit 1
          }

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build desktop app
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          export PATH="$(go env GOPATH)/bin:$PATH"
          OUT="media-dedupe-app${{ matrix.ext }}"

          # No -nsis: Windows ships as a single portable exe.
          wails build -platform "${{ matrix.goos }}/${{ matrix.goarch }}" -o "${OUT%.*}"

          mkdir -p out

          if [ "${{ matrix.goos }}" = "windows" ]; then
            if [ -f "build/bin/${OUT}" ]; then
              BIN="build/bin/${OUT}"
            else
              BIN="${OUT}"
            fi
            test -f "$BIN"
            ls -la build/bin "$BIN" || true
            # Windows runners have no zip(1); use PowerShell Compress-Archive
            powershell.exe -NoProfile -Command \
              "Compress-Archive -Force -Path '$BIN' -DestinationPath 'out/media-dedupe-app_${VERSION}_windows_${{ matrix.goarch }}.zip'"
          else
            APP="build/bin/media-dedupe-app.app"
            if [ ! -d "$APP" ]; then
              APP="build/bin/media-dedupe.app"
            fi
            test -d "$APP"
            ls -la build/bin "$APP" || true
            tar czf "out/media-dedupe-app_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" \
              -C build/bin "$(basename "$APP")"
          fi

      - name: Upload app artifact
        uses: actions/upload-artifact@v5
        with:
          name: media-dedupe-app-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build-app]
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true

      - name: Checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          test "${#assets[@]}" -ge 1

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "media-dedupe $GITHUB_REF_NAME" \
              --generate-notes
          fi
