name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: arm64
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: windows
            goarch: amd64
            ext: ".exe"
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate release tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must match vMAJOR.MINOR.PATCH"
            exit 1
          }

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BIN="media-dedupe${{ matrix.ext }}"
          mkdir -p dist out
          go build -trimpath -ldflags="-s -w" -o "dist/${BIN}" ./cmd/media-dedupe
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip "../out/media-dedupe_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip" "${BIN}"
          else
            tar czf "../out/media-dedupe_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" "${BIN}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: media-dedupe-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/*
          if-no-files-found: error

  build-app-windows:
    name: Build Wails app windows/amd64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate release tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must match vMAJOR.MINOR.PATCH"
            exit 1
          }

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build desktop app
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          export PATH="$(go env GOPATH)/bin:$PATH"
          wails build -platform windows/amd64 -o media-dedupe-app.exe
          mkdir -p out
          if [ -f "build/bin/media-dedupe-app.exe" ]; then
            BIN="build/bin/media-dedupe-app.exe"
          else
            BIN="media-dedupe-app.exe"
          fi
          test -f "$BIN"
          ls -la build/bin "$BIN" || true
          # Windows runners have no zip(1); use PowerShell Compress-Archive
          powershell.exe -NoProfile -Command \
            "Compress-Archive -Force -Path '$BIN' -DestinationPath 'out/media-dedupe-app_${VERSION}_windows_amd64.zip'"

      - name: Upload app artifact
        uses: actions/upload-artifact@v5
        with:
          name: media-dedupe-app-windows-amd64
          path: out/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build, build-app-windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true

      - name: Checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          test "${#assets[@]}" -ge 1

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "media-dedupe $GITHUB_REF_NAME" \
              --generate-notes
          fi
